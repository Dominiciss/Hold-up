<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet">
    <title>Judge activity</title>
</head>

<body>
    <main id="manuel-emanuel-main">
        <style>
            #manuel-emanuel-main {
                all: unset;
                padding: 0;
                margin: 0;
                font-family: Inter;
                display: flex;
            }

            #manuel-emanuel-main .gn-ctn {
                all: unset;
            }

            #manuel-emanuel-main .result {
                all: unset;
                position: absolute;
                top: 10px;
                left: 10px;
                background: rgb(49, 29, 4);
                background: radial-gradient(circle, rgb(49, 29, 4) 0%, rgb(46, 31, 12) 100%);
                width: 600px;
                height: 600px;
                padding: 5px;
                border-radius: 5px;
                z-index: -1;
            }

            #manuel-emanuel-main .result h1 {
                text-align: left;
                margin: 0 10px;
                padding: 0;
                font-size: 1.25rem;
                user-select: none;
            }

            #manuel-emanuel-main .result h1 span {
                background: radial-gradient(circle, rgb(206, 206, 206) 0%, rgb(150, 150, 150)) 100%;
                -webkit-text-fill-color: transparent;
                -webkit-background-clip: text;
                background-clip: text;
            }

            #manuel-emanuel-main .result p {
                margin: 10px 15px;
                padding: 5px 10px;
                text-align: justify;
                height: 500px;
                background-color: rgba(255, 255, 255, 0.5);
                backdrop-filter: blur(5px);
                border-radius: 5px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            #manuel-emanuel-main .btn-bg.open-padlet {
                justify-self: end;
                margin: 10px 20px;
            }

            #manuel-emanuel-main .btn-bg.open-padlet button {
                background: radial-gradient(circle, rgb(206, 206, 206) 0%, rgb(150, 150, 150)) 100%;
                -webkit-text-fill-color: transparent;
                -webkit-background-clip: text;
                background-clip: text;
            }

            #manuel-emanuel-main .result .go-back {
                position: absolute;
                top: 10px;
                right: 20px;
                color: white;
            }

            #manuel-emanuel-main .result .go-back:hover {
                transform: scale(0.90);
                cursor: pointer;
            }

            #manuel-emanuel-main form {
                all: unset;
                background: rgb(49, 29, 4);
                background: radial-gradient(circle, rgb(49, 29, 4) 0%, rgb(46, 31, 12) 100%);
                width: 600px;
                height: 600px;
                padding: 5px;
                display: flex;
                flex-direction: column;
                align-items: center;
                border-radius: 5px;
            }

            #manuel-emanuel-main textarea {
                all: unset;
                width: 560px;
                height: 530px;
                max-width: 560px;
                min-width: 560px;
                padding: 10px;
                margin: 20px 20px 4px 20px;
                box-sizing: border-box;
                background-color: rgba(255, 255, 255, 0.5);
                backdrop-filter: blur(5px);
                font-family: Inter;
                border-radius: 5px;
            }

            #manuel-emanuel-main .btm-ctn {
                display: flex;
                width: 600px;
                height: 30px;
                padding: 0;
                margin: 4px 0 0 0;
                justify-content: center;
                align-items: center;
            }

            #manuel-emanuel-main form p {
                font-family: Inter;
                text-decoration: underline;
                margin: 0 10px 0 0;
                user-select: none;
            }

            #manuel-emanuel-main p.limit {
                color: rgb(134, 2, 2);
            }

            #manuel-emanuel-main .btn-bg {
                width: 450px;
                height: 30px;
                margin: 0 0 0 10px;
                padding: 0;
                background-image: radial-gradient(circle, rgb(40, 40, 40) 0%, rgb(20, 20, 20) 100%);
                display: flex;
                justify-content: center;
                align-items: center;
                border-radius: 5px;
                transition: transform 0.4s ease-out;
                user-select: none;
            }

            #manuel-emanuel-main .btn-bg.disabled {
                transform: scale(0.90);
                filter: grayscale(90) blur(.5px) opacity(90%);
            }

            #manuel-emanuel-main .btn-bg:not(.disabled):hover {
                transform: scale(1.05);
                cursor: pointer;
            }

            #manuel-emanuel-main button {
                all: unset;
                background: rgb(25, 173, 25);
                margin: 0;
                padding: 0;
                font-family: Inter;
                font-weight: 500;
                font-size: 1.2rem;
                background: linear-gradient(to right, rgb(137, 240, 137) 0%, rgb(25, 173, 25)) 100%;
                -webkit-text-fill-color: transparent;
                -webkit-background-clip: text;
                background-clip: text;
            }

            #manuel-emanuel-main #manuel-emanuel-padlet-iframe {
                margin: 0 20px;
            }

            #manuel-emanuel-main #manuel-emanuel-padlet-iframe.hidden {
                opacity: 0;
                pointer-events: none;
                user-select: none;
            }
        </style>

        <div class="gn-ctn">
            <form action="">
                <textarea id="manuel-emanuel-textarea" placeholder="Start tipying your argument here..."></textarea>
                <div class="btm-ctn">
                    <p id="manuel-emanuel-wordlimit" class="limit">0/150 words</p>
                    <div class="btn-bg disabled"><button id="manuel-emanuel-btn-send">Submit statement</button></div>
                </div>
            </form>
            <div class="result" id="manuel-emanuel-result">
                <h1><span>AI Judge verdict</span>🧑‍⚖️</h1>
                <p id="manuel-emanuel-response">Waiting for response...</p>
                <button class="go-back" id="manuel-emanuel-go-back"><svg xmlns="http://www.w3.org/2000/svg" width="1em"
                        height="1em" viewBox="0 0 56 56">
                        <path d="M0 0h56v56H0z" fill="none" />
                        <path fill="currentColor"
                            d="M19.281 49.516c1.242 0 2.063-.844 2.063-2.063c0-.61-.188-1.055-.563-1.43l-6.75-6.586l-4.453-3.796l5.508.234h29.906c5.46 0 7.735-2.508 7.735-7.805V14.22c0-5.461-2.274-7.735-7.735-7.735H31.867c-1.289 0-2.133.938-2.133 2.086c0 1.149.844 2.086 2.133 2.086h13.125c2.484 0 3.563 1.078 3.563 3.563v13.85c0 2.555-1.079 3.633-3.563 3.633H15.086l-5.508.235l4.453-3.797l6.75-6.586c.375-.375.563-.844.563-1.453c0-1.196-.82-2.063-2.063-2.063c-.515 0-1.125.258-1.523.656L3.976 32.22c-.468.445-.703.984-.703 1.57c0 .563.235 1.125.703 1.57l13.782 13.524a2.27 2.27 0 0 0 1.523.633" />
                    </svg>
                </button>
                <div class="btn-bg open-padlet"><button id="manuel-emanuel-btn-padlet">Copy text and open padlet</button>
                </div>
            </div>
        </div>

        <div id="manuel-emanuel-padlet-iframe" class="hidden">
            <div class="padlet-embed"
                style="border:1px solid rgba(0,0,0,0.1);border-radius:5px;box-sizing:border-box;overflow:hidden;position:relative;width:100%;background:#F4F4F4">
                <p style="padding:0;margin:0"><iframe src="https://padlet.com/embed/ulyfqz1idbs9lnnm" frameborder="0"
                        allow="camera;microphone;geolocation;display-capture;clipboard-write"
                        style="width:500px;height:608px;display:block;padding:0;margin:0"></iframe></p>
            </div>
        </div>

        <script>
            const textarea = document.getElementById("manuel-emanuel-textarea")
            const word_limit = document.getElementById("manuel-emanuel-wordlimit")
            const send_button = document.getElementById("manuel-emanuel-btn-send")
            const padlet_button = document.getElementById("manuel-emanuel-btn-padlet")
            const result_tab = document.getElementById("manuel-emanuel-result")
            const return_button = document.getElementById("manuel-emanuel-go-back")
            const text_response = document.getElementById("manuel-emanuel-response")
            let bool_limit = true

            textarea.addEventListener("input", (e) => {
                let word_count = textarea.value.split(" ").filter((e) => e != "" && e != " ").length
                word_limit.textContent = word_count + "/150 words"

                if ((word_count > 150 || word_count == 0) && !bool_limit) {
                    send_button.parentElement.classList.add("disabled")
                    word_limit.classList.add("limit")
                    bool_limit = true
                } else if (word_count <= 150 && bool_limit) {
                    send_button.parentElement.classList.remove("disabled")
                    word_limit.classList.remove("limit")
                    bool_limit = false
                }
            })

            send_button.parentElement.addEventListener('click', (e) => {
                e.preventDefault()
                if (bool_limit) {
                    return
                }

                createQuery(textarea.value)

                result_tab.style['zIndex'] = 1
            })

            return_button.addEventListener('click', (e) => {
                result_tab.style['zIndex'] = -1
                text_response.textContent = "Waiting for response..."
            })

            padlet_button.addEventListener('click', (e) => {
                padlet_iframe = document.getElementById("manuel-emanuel-padlet-iframe")

                if (padlet_iframe.classList.contains("hidden")) {
                    padlet_iframe.classList.remove("hidden")
                    padlet_button.textContent = "Close padlet"
                    navigator.clipboard.writeText(`➤ Student's text📜:\n    ${textarea.value}\n\n➤ AI's answer🧑‍⚖️:\n    ${text_response.textContent}\n\n➤ Student's comment on the activity🧠:\n    Write your comments here...`)
                } else {
                    padlet_iframe.classList.add("hidden")
                    padlet_button.textContent = "Copy text and open padlet"
                }
            })

            async function createQuery(text) {
                const apiKey = new URLSearchParams(window.location.search).get("c")

                const url = "https://api.groq.com/openai/v1/chat/completions"

                const payload = {
                    "messages": [
                        {
                            "role": "user",
                            "content": "Role: A biased AI Judge & EFL Evaluator. You are a strict judge who has a soft side for family involvement. You tend to do “exceptions” regarding family if the defense manages to express their argument well.\nContext: You are a Judge reviewing the case of John Williams. He is an adult in his twenties that went inside Citibank with a gun and tried to rob it. Inside the bank, he shouts for everyone to get down on the floor but two elderly women refuse to lie down. One of the women was Frances who was complaining about dirty carpets (germaphobia) and the other had bad knees. The effort of both these women helped buy enough time for police to arrive. John was detained right there and he didn’t cause any harm or trouble in the bank.John Williams has a family with a daughter who is 7 years old. John Williams is divorced and has an ex-wife who he has to pay child support for. He has a boss named “R.” who is the one that forced him to rob this bank. John also has messages from Citibank contacting him about his loan that he didn’t pay and also he has a message about a job opportunity where he was rejected. There is evidence about all of this context.\nTask: Evaluate the student's persuasive text either defending or prosecuting the thief. You won’t always need to say that it has mistakes. If you don’t find any, don't invent mistakes that don’t exist. Also suggest good expressions that may be fitting in this case or connectors that could be of use. Remember students have a B2 level (do not mention the English level in the answer).\nEvaluation Criteria:\nLogic & Morality: Sound reasoning and accurate integration of story details, but also leave space for emotions. John could be innocent as an “exception” because of the judge’s emotion. He is not impartial.\nLanguage: Cohesion, use of argumentative discourse markers, grammatical accuracy, and formal tone. \nOutput Format:\nProvide a decisive verdict according to the text provided by the student. Start your paragraph with the sentence “John is found guilty” or “John is innocent”. John might be considered “innocent” even though he has to serve labor work or a small sentence. Address the student directly in your text. Tell the students the areas of their text where they can improve in both their language use and their ability to defend or prosecute the thief. This should be the only paragraph you have on your answer to the query that is sent to you.\nStudent Text:\n" + text
                        }
                    ],
                    "model": "groq/compound",
                    "temperature": 1,
                    "max_completion_tokens": 1024,
                    "top_p": 1,
                    "stream": true,
                    "stop": null,
                    "compound_custom": {
                        "tools": {
                            "enabled_tools": [
                                "web_search",
                                "code_interpreter",
                                "visit_website"
                            ]
                        }
                    }
                }

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    })

                    if (!response.ok) {
                        throw new Error(`HTTP Error! Status: ${response.status} - ${await response.text()}`)
                    }

                    const reader = response.body.getReader()
                    const decoder = new TextDecoder("utf-8")
                    let buffer = ''
                    let fullText = ''

                    while (true) {
                        const { done, value } = await reader.read()
                        if (done) break

                        buffer += decoder.decode(value, { stream: true })

                        const lines = buffer.split('\n')

                        buffer = lines.pop()

                        for (const line of lines) {
                            if (line.trim() === '' || line.startsWith(':')) continue

                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6).trim()

                                if (dataStr === '[DONE]') {
                                    text_response.textContent = fullText
                                    return
                                }

                                try {
                                    const parsed = JSON.parse(dataStr)
                                    const content = parsed.choices[0]?.delta?.content || ''
                                    fullText += content
                                } catch (e) {
                                    console.error("Error parsing JSON chunk:", e)
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error("Request failed:", error)
                }
            }
        </script>
    </main>
</body>

</html>
